<script>
(function () {
  // Try to read amount / order info if WayForPay appended them to the URL.
  var p = new URLSearchParams(window.location.search);
  var value = parseFloat(p.get('amount') || p.get('value') || '') || undefined;
  var orderId = p.get('orderReference') || p.get('order') || undefined;

  // Push into the GTM dataLayer — create a "purchase" trigger in GTM on this event.
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'purchase',
    ecommerce: {
      currency: 'UAH',
      value: value,
      transaction_id: orderId,
      items: [{ item_name: 'Квиток — Територія Жінки. Таємні файли' }]
    }
  });

  // Fire Meta Pixel Purchase as a fallback (in case it is not managed via GTM).
  if (typeof fbq === 'function') {
    fbq('track', 'Purchase', { currency: 'UAH', value: value || 0 });
  }
})();
</script>

<style>
:root{

body{

.card{

.seal{

}
.seal svg{ width:46px; height:46px; stroke:var(--ink); }
.card .eyebrow{ display:block; font-weight:600; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-hot); margin:0 0 28px; }
.display{ font-family:'Bodoni Moda','Playfair Display',serif; font-weight:800; letter-spacing:-.025em; }
.card h1{ font-size:clamp(34px,7vw,56px); line-height:1.12; margin:0 0 48px; }
.card .lead{ color:rgba(245,232,208,.8); font-size:17px; margin:0 auto 40px; max-width:440px; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.6rem;
  padding:16px 30px; border-radius:999px;
  font-weight:800; font-size:14px; letter-spacing:.14em; text-transform:uppercase;

  transition: transform .3s ease, filter .25s ease;
}
.btn:hover{ transform:translateY(-3px) scale(1.03); filter:brightness(1.06); }
.note{ margin-top:26px; font-size:14px; color:rgba(245,232,208,.6); }
.note a{ color:var(--gold-hot); }
@keyframes pop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
